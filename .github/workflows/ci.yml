name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job de Verificação (Roda em todo PR e Push)
  quality-check:
    name: 🛡️ Quality Check (Lint & Tests)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm run install:all

      - name: 🔍 Linting (Frontend)
        working-directory: ./ingressosZ
        run: npm run lint

      - name: 🔍 Linting (Backend)
        working-directory: ./functions
        run: npm run lint

      - name: 🧪 Unit Tests (Frontend)
        working-directory: ./ingressosZ
        run: npm run test

      - name: 🧪 Unit Tests (Backend)
        working-directory: ./functions
        run: npm run test

  # Job de Build (Garante que o projeto compila)
  build-check:
    name: 🏗️ Build Verification
    needs: quality-check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm run install:all

      - name: Build Frontend
        working-directory: ./ingressosZ
        run: npm run build

      - name: Build Backend
        working-directory: ./functions
        run: npm run build
