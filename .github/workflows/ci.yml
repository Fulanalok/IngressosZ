name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job de verificacao (roda em todo PR e push)
  quality-check:
    name: Quality Check (Lint & Tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm run ci:install

      - name: Linting (Frontend)
        working-directory: ./ingressosZ
        run: npm run lint

      - name: Typecheck (Frontend)
        working-directory: ./ingressosZ
        run: npm run typecheck

      - name: Linting (Backend)
        working-directory: ./functions
        run: npm run lint

      - name: Unit Tests (Frontend)
        working-directory: ./ingressosZ
        run: npm run test

      - name: Firestore Rules Tests
        run: npm run test:rules

      - name: Unit Tests (Backend)
        working-directory: ./functions
        run: npm run test

      - name: E2E (Cypress)
        uses: cypress-io/github-action@v6
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyDUMMY_CI_ONLY_KEY_000000000000000"
          VITE_FIREBASE_AUTH_DOMAIN: "ingressosz-ci.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "ingressosz-ci"
          VITE_FIREBASE_STORAGE_BUCKET: "ingressosz-ci.appspot.com"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
          VITE_FIREBASE_APP_ID: "1:123456789012:web:0000000000000000000000"
          VITE_FUNCTIONS_REGION: "southamerica-east1"
          VITE_USE_EMULATORS: "false"
          VITE_APPCHECK_DEBUG_TOKEN: "false"
        with:
          working-directory: ./ingressosZ
          install: false
          start: npm run dev -- --host 127.0.0.1 --port 5173
          wait-on: http://127.0.0.1:5173
          wait-on-timeout: 120

  # Job de build (garante que o projeto compila)
  build-check:
    name: Build Verification
    needs: quality-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm run ci:install

      - name: Build Frontend
        working-directory: ./ingressosZ
        run: npm run build

      - name: Build Backend
        working-directory: ./functions
        run: npm run build
